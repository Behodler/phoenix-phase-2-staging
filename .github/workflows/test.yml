name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check for conflict markers and unparseable deployment JSON
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' -- ':!lib'; then
            echo "::error::Unresolved merge-conflict markers found in tracked files (see above)"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const dir = "server/deployments";
            let failed = false;
            for (const f of fs.readdirSync(dir).filter((n) => n.endsWith(".json"))) {
              try { JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8")); }
              catch (e) { console.error(`::error file=${dir}/${f}::${e.message}`); failed = true; }
            }
            if (failed) process.exit(1);
          '

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
